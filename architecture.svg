<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="674" fill="url(#bg)"/>

  <!-- ── Header ── -->
  <rect x="0" y="0" width="1000" height="56" fill="#6366f1" fill-opacity="0.9"/>
  <text x="28" y="22" font-size="10" fill="#c7d2fe" font-weight="600" letter-spacing="3">SNOWBALL</text>
  <text x="28" y="44" font-size="18" fill="white" font-weight="700">레버리지 ETF 자동매매 · 아키텍처 개요</text>
  <text x="972" y="30" font-size="10" fill="#e0e7ff" text-anchor="end">Kotlin 2.1 · Ktor 3.0 · Clean Architecture</text>
  <text x="972" y="46" font-size="10" fill="#e0e7ff" text-anchor="end">v0.2.5</text>

  <!-- ════════════════════════════════════════════
       ROW 1 — Client  +  Presentation  +  Application
  ════════════════════════════════════════════ -->

  <!-- Client -->
  <rect x="28" y="82" width="110" height="56" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#sh)"/>
  <text x="83" y="104" font-size="10" fill="#94a3b8" text-anchor="middle">Client</text>
  <text x="83" y="122" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="600">Mobile / Web</text>

  <!-- arrow: Client → Presentation -->
  <line x1="138" y1="110" x2="176" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="157" y="105" font-size="8" fill="#64748b" text-anchor="middle">API Key</text>

  <!-- Presentation module -->
  <rect x="177" y="70" width="200" height="80" rx="8" fill="#0c2340" stroke="#38bdf8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="177" y="70" width="200" height="22" rx="8" fill="#0ea5e9" fill-opacity="0.6"/>
  <rect x="177" y="82" width="200" height="10" fill="#0ea5e9" fill-opacity="0.6"/>
  <text x="277" y="86" font-size="10" fill="white" text-anchor="middle" font-weight="700" letter-spacing="1">presentation</text>
  <text x="277" y="108" font-size="9" fill="#7dd3fc" text-anchor="middle">REST Routing</text>
  <text x="277" y="122" font-size="9" fill="#94a3b8" text-anchor="middle">Response Mapper · Rate Limiting</text>
  <text x="277" y="140" font-size="8" fill="#64748b" text-anchor="middle">GET /sb/home · /sb/account · /sb/stock · POST /sb/backtest</text>

  <!-- Application module -->
  <rect x="177" y="162" width="200" height="115" rx="8" fill="#0c2340" stroke="#818cf8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="177" y="162" width="200" height="22" rx="8" fill="#6366f1" fill-opacity="0.6"/>
  <rect x="177" y="174" width="200" height="10" fill="#6366f1" fill-opacity="0.6"/>
  <text x="277" y="178" font-size="10" fill="white" text-anchor="middle" font-weight="700" letter-spacing="1">application</text>
  <text x="277" y="200" font-size="9" fill="#a5b4fc" text-anchor="middle">Ktor Server · Koin DI</text>
  <text x="277" y="216" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="600">⏰ Quartz Scheduler</text>
  <text x="277" y="231" font-size="8" fill="#64748b" text-anchor="middle">StockPriceSyncJob  05:00 NY</text>
  <text x="277" y="244" font-size="8" fill="#64748b" text-anchor="middle">SyncJob  06:20 KST · OrderJob  18:05 KST</text>
  <text x="277" y="268" font-size="8" fill="#64748b" text-anchor="middle">(weekdays only)</text>

