  <text x="500" y="335" font-size="8" fill="#94a3b8" text-anchor="middle">InvestmentStatusRepo · TradeHistoryRepo</text>
  <text x="500" y="349" font-size="8" fill="#94a3b8" text-anchor="middle">ExecutionRepo</text>

