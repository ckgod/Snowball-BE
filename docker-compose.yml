version: '3.8'

services:
  app:
    build: .
    image: trading-bot:latest
    container_name: my-bot
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mariadb://db:3306/snowball_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: snowball_db
    # 외부 노출은 caddy 가 맡는다. app 은 내부 네트워크에만 연다.
    expose:
      - "8080"
    depends_on:
      - db
    networks:
      - bot-network

  caddy:
    image: caddy:2
    container_name: snowball-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서 보관. 이름 있는 볼륨이라 compose down 에도 유지된다 (재발급 한도 보호)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - bot-network

  db:
    image: mariadb:10.11
    container_name: snowball-db
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: snowball_db
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=64M
      --max_connections=20
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
