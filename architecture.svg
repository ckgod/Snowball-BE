  <text x="500" y="155" font-size="8" fill="#86efac" text-anchor="middle">SyncStrategyUseCase</text>
  <rect x="404" y="164" width="192" height="18" rx="4" fill="#064e3b"/>
  <text x="500" y="177" font-size="8" fill="#86efac" text-anchor="middle">GenerateOrdersUseCase</text>
  <rect x="404" y="186" width="192" height="18" rx="4" fill="#064e3b"/>
  <text x="500" y="199" font-size="8" fill="#86efac" text-anchor="middle">BacktestUseCase</text>
  <rect x="404" y="208" width="92" height="18" rx="4" fill="#064e3b"/>
  <text x="450" y="221" font-size="8" fill="#86efac" text-anchor="middle">GetCurrentPrice</text>
  <rect x="502" y="208" width="94" height="18" rx="4" fill="#064e3b"/>
  <text x="549" y="221" font-size="8" fill="#86efac" text-anchor="middle">GetStockHistory</text>

  <line x1="404" y1="234" x2="596" y2="234" stroke="#065f46" stroke-width="1"/>

